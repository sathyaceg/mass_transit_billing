[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-transit-billing"
version = "0.1.0"
description = "Mass transit billing challenge"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "autopep8==2.3.2",
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
